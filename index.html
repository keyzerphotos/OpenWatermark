<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenWatermark — Bescherm je foto's</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.2/dist/jszip.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-2: #1c1c1c;
    --border: #262626;
    --text: #ededed;
    --text-dim: #8a8a8a;
    --accent: #f0b429;
    --accent-dim: #b8860b;
    --danger: #e5484d;
    --success: #30a46c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 60px;
  }
  header { width: 100%; max-width: 780px; margin-bottom: 28px; text-align: center; }
  .logo { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .logo-mark {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px; color: #0a0a0a;
    box-shadow: 0 4px 16px rgba(240, 180, 41, 0.2);
  }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
  .subtitle {
    font-size: 0.85rem; color: var(--text-dim);
    line-height: 1.5; max-width: 500px; margin: 0 auto;
  }
  .card {
    width: 100%; max-width: 780px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 0.75rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-dim); margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title::before {
    content: ''; width: 4px; height: 14px;
    background: var(--accent); border-radius: 2px;
  }
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 28px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--surface-2);
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(240, 180, 41, 0.04);
  }
  .drop-zone .icon { font-size: 1.6rem; margin-bottom: 8px; opacity: 0.7; }
  .drop-zone .label { font-size: 0.9rem; font-weight: 500; color: var(--text); margin-bottom: 4px; }
  .drop-zone .hint { font-size: 0.75rem; color: var(--text-dim); }
  .photo-list {
    margin-top: 14px; max-height: 240px;
    overflow-y: auto; display: none;
  }
  .photo-list.visible { display: block; }
  .photo-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    background: var(--surface-2);
    border-radius: 8px; margin-bottom: 6px;
    font-size: 0.8rem;
  }
  .photo-item .thumb {
    width: 36px; height: 36px; border-radius: 6px;
    object-fit: cover; background: #000; flex-shrink: 0;
  }
  .photo-item .name {
    flex: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--text);
  }
  .photo-item .remove {
    color: var(--text-dim); cursor: pointer;
    padding: 4px 8px; font-size: 1rem; line-height: 1;
  }
  .photo-item .remove:hover { color: var(--danger); }
  .logo-row {
    display: flex; align-items: center; gap: 14px;
    padding: 10px; background: var(--surface-2); border-radius: 10px;
  }
  .logo-thumb {
    width: 56px; height: 56px; object-fit: contain;
    background: repeating-conic-gradient(#2a2a2a 0% 25%, #1c1c1c 0% 50%) 50% / 12px 12px;
    border-radius: 8px; border: 1px solid var(--border);
    padding: 4px; flex-shrink: 0;
  }
  .logo-info { flex: 1; font-size: 0.8rem; }
  .logo-info .name { color: var(--text); font-weight: 500; margin-bottom: 2px; }
  .logo-info .meta { color: var(--text-dim); font-size: 0.72rem; }
  .controls { display: block; }
  .slider-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .slider-row:last-child { border-bottom: none; }
  .slider-row label {
    font-size: 0.8rem; color: var(--text-dim);
    min-width: 100px; flex-shrink: 0;
  }
  .slider-row input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 4px; background: var(--border);
    border-radius: 2px; outline: none;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; background: var(--accent);
    border-radius: 50%; cursor: pointer;
    box-shadow: 0 2px 8px rgba(240, 180, 41, 0.3);
  }
  .slider-row input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px; background: var(--accent);
    border-radius: 50%; cursor: pointer; border: none;
  }
  .slider-row .value {
    font-size: 0.78rem; color: var(--accent);
    min-width: 48px; text-align: right;
    font-variant-numeric: tabular-nums; font-weight: 600;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; padding: 14px 20px;
    border: none; border-radius: 12px;
    font-size: 0.9rem; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
    font-family: inherit; width: 100%;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    color: #0a0a0a;
    box-shadow: 0 4px 16px rgba(240, 180, 41, 0.25);
  }
  .btn-secondary {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-small { padding: 8px 14px; font-size: 0.78rem; width: auto; border-radius: 8px; }
  .btn-row { display: flex; gap: 10px; margin-top: 14px; }
  .preview-wrap { display: none; margin-top: 14px; }
  .preview-wrap.visible { display: block; }
  .preview-wrap img {
    width: 100%; border-radius: 10px; border: 1px solid var(--border);
  }
  .preview-label {
    font-size: 0.72rem; color: var(--text-dim);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .status {
    font-size: 0.8rem; color: var(--text-dim);
    text-align: center; min-height: 1.4em;
    margin: 16px 0; width: 100%; max-width: 780px;
  }
  .status.success { color: var(--success); }
  .status.error { color: var(--danger); }
  .progress-bar {
    width: 100%; height: 4px; background: var(--border);
    border-radius: 2px; overflow: hidden;
    margin-top: 10px; display: none;
  }
  .progress-bar.visible { display: block; }
  .progress-fill {
    height: 100%; background: var(--accent);
    width: 0%; transition: width 0.2s;
  }
  .notice {
    width: 100%; max-width: 780px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 0.76rem; color: var(--text-dim);
    line-height: 1.6; margin-top: 20px;
  }
  .notice strong { color: var(--accent); font-weight: 600; }
  footer {
    margin-top: 32px; font-size: 0.72rem;
    color: var(--text-dim); text-align: center; line-height: 1.6;
  }
  footer a { color: var(--accent); text-decoration: none; }
  .lang-switch {
    position: absolute; top: 16px; right: 16px;
    display: flex; gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 3px;
    font-size: 0.72rem;
  }
  .lang-switch button {
    background: transparent; border: none;
    color: var(--text-dim); cursor: pointer;
    padding: 4px 8px; border-radius: 6px;
    font-family: inherit; font-size: inherit;
    font-weight: 600; transition: all 0.15s;
  }
  .lang-switch button.active {
    background: var(--accent); color: #0a0a0a;
  }
</style>
</head>
<body>

<div class="lang-switch">
  <button data-lang="nl">NL</button>
  <button data-lang="en">EN</button>
  <button data-lang="de">DE</button>
</div>

<header>
  <div class="logo">
    <div class="logo-mark">OW</div>
    <h1>OpenWatermark</h1>
  </div>
  <p class="subtitle" data-i18n="subtitle"></p>
</header>

<div class="card">
  <div class="card-title" data-i18n="photos_title"></div>
  <div class="drop-zone" id="photoZone">
    <div class="icon">📷</div>
    <div class="label" data-i18n="photos_drop"></div>
    <div class="hint" data-i18n="photos_hint"></div>
    <input type="file" id="photoInput" accept="image/*" multiple hidden>
  </div>
  <div class="photo-list" id="photoList"></div>
</div>

<div class="card">
  <div class="card-title" data-i18n="logo_title"></div>
  <div class="drop-zone" id="logoZone">
    <div class="icon">✦</div>
    <div class="label" data-i18n="logo_drop"></div>
    <div class="hint" data-i18n="logo_hint"></div>
    <input type="file" id="logoInput" accept="image/png,image/svg+xml,image/webp" hidden>
  </div>
  <div id="logoInfoRow" style="display:none; margin-top:14px;">
    <div class="logo-row">
      <img id="logoThumb" class="logo-thumb" alt="">
      <div class="logo-info">
        <div class="name" id="logoName">logo.png</div>
        <div class="meta" data-i18n="logo_ready"></div>
      </div>
      <button class="btn btn-secondary btn-small" id="changeLogoBtn" data-i18n="logo_change"></button>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-title" data-i18n="settings_title"></div>
  <div class="controls" id="controls">
    <div class="slider-row">
      <label data-i18n="set_size"></label>
      <input type="range" id="logoSize" min="5" max="40" value="15">
      <span class="value" id="logoSizeVal">15%</span>
    </div>
    <div class="slider-row">
      <label data-i18n="set_opacity"></label>
      <input type="range" id="opacity" min="10" max="80" value="35">
      <span class="value" id="opacityVal">35%</span>
    </div>
    <div class="slider-row">
      <label data-i18n="set_rotation"></label>
      <input type="range" id="rotation" min="-60" max="0" value="-30">
      <span class="value" id="rotationVal">-30°</span>
    </div>
    <div class="slider-row">
      <label data-i18n="set_spacing"></label>
      <input type="range" id="spacing" min="100" max="500" value="220">
      <span class="value" id="spacingVal">220</span>
    </div>
  </div>
</div>

<div class="card" id="resultCard" style="display:none;">
  <div class="card-title" data-i18n="result_title"></div>
  <div class="preview-wrap visible" id="previewWrap">
    <div class="preview-label" data-i18n="result_preview"></div>
    <img id="preview" alt="">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="downloadZipBtn" data-i18n="result_download"></button>
  </div>
  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="resetBtn" data-i18n="result_reset"></button>
  </div>
</div>

<div class="status" id="status"></div>

<div class="notice">
  <strong data-i18n="notice_strong"></strong>
  <span data-i18n="notice_text"></span>
</div>

<footer>
  <span data-i18n="footer_text"></span>
  <a href="https://github.com/keyzerphotos/OpenWatermark">GitHub</a><br>
  <span data-i18n="footer_privacy"></span>
</footer>

<script>
(function() {
  'use strict';

  // ---------- Vertalingen ----------
  const TRANSLATIONS = {
    nl: {
      subtitle: "Bescherm je foto's met je eigen logo. Alles lokaal in je browser — niets wordt geüpload.",
      photos_title: "Foto's",
      photos_drop: "Sleep je foto's hierheen",
      photos_hint: "of tik om te kiezen · meerdere foto's mogelijk",
      logo_title: "Jouw logo",
      logo_drop: "Sleep je logo hierheen",
      logo_hint: "PNG met transparante achtergrond werkt het best",
      logo_ready: "Klaar voor gebruik",
      logo_change: "Wijzigen",
      settings_title: "Instellingen",
      set_size: "Logogrootte",
      set_opacity: "Transparantie",
      set_rotation: "Rotatie",
      set_spacing: "Afstand",
      result_title: "Resultaat",
      result_preview: "Voorbeeld (eerste foto)",
      result_download: "⬇ Download alle foto's (ZIP)",
      result_reset: "Alles wissen",
      notice_strong: "Eerlijk:",
      notice_text: " een zichtbaar watermerk maakt verwijdering lastiger, maar niet onmogelijk. Herhaling over de hele foto is moeilijker weg te poetsen dan één logo in een hoek. Voor echte herkomstbescherming is C2PA-metadata nodig — dat zit al in moderne camera's zoals Nikon Z9 en Canon R5 Mark II.",
      footer_text: "OpenWatermark · Open source op",
      footer_privacy: "Je foto's blijven op je toestel. Niets wordt verstuurd.",
      max_photos: (max, skipped) => `Maximaal ${max} foto's per keer. ${skipped} overgeslagen.`,
      photos_loaded: (n) => `${n} foto('s) geladen.`,
      logo_loaded: "Logo geladen.",
      logo_must_be_image: "Logo moet een afbeelding zijn.",
      logo_load_error: "Logo kon niet geladen worden.",
      processing: (n) => `Bezig met ${n} foto('s)...`,
      creating_zip: "ZIP maken...",
      done_zip: (n) => `Klaar! ${n} foto('s) gedownload als ZIP.`,
      error_prefix: "Fout: ",
      preview_error: "Fout bij voorbeeld: ",
    },
    en: {
      subtitle: "Protect your photos with your own logo. Everything local in your browser — nothing is uploaded.",
      photos_title: "Photos",
      photos_drop: "Drag your photos here",
      photos_hint: "or tap to choose · multiple photos allowed",
      logo_title: "Your logo",
      logo_drop: "Drag your logo here",
      logo_hint: "PNG with transparent background works best",
      logo_ready: "Ready to use",
      logo_change: "Change",
      settings_title: "Settings",
      set_size: "Logo size",
      set_opacity: "Opacity",
      set_rotation: "Rotation",
      set_spacing: "Spacing",
      result_title: "Result",
      result_preview: "Preview (first photo)",
      result_download: "⬇ Download all photos (ZIP)",
      result_reset: "Clear all",
      notice_strong: "Honest:",
      notice_text: " a visible watermark makes removal harder, but not impossible. Repeating across the whole photo is harder to erase than a single logo in a corner. For real provenance protection, C2PA metadata is needed — already built into modern cameras like the Nikon Z9 and Canon R5 Mark II.",
      footer_text: "OpenWatermark · Open source on",
      footer_privacy: "Your photos stay on your device. Nothing is sent.",
      max_photos: (max, skipped) => `Maximum ${max} photos at a time. ${skipped} skipped.`,
      photos_loaded: (n) => `${n} photo(s) loaded.`,
      logo_loaded: "Logo loaded.",
      logo_must_be_image: "Logo must be an image.",
      logo_load_error: "Logo could not be loaded.",
      processing: (n) => `Processing ${n} photo(s)...`,
      creating_zip: "Creating ZIP...",
      done_zip: (n) => `Done! ${n} photo(s) downloaded as ZIP.`,
      error_prefix: "Error: ",
      preview_error: "Preview error: ",
    },
    de: {
      subtitle: "Schütze deine Fotos mit deinem eigenen Logo. Alles lokal im Browser — nichts wird hochgeladen.",
      photos_title: "Fotos",
      photos_drop: "Ziehe deine Fotos hierher",
      photos_hint: "oder tippe zum Auswählen · mehrere Fotos möglich",
      logo_title: "Dein Logo",
      logo_drop: "Ziehe dein Logo hierher",
      logo_hint: "PNG mit transparentem Hintergrund funktioniert am besten",
      logo_ready: "Bereit zur Verwendung",
      logo_change: "Ändern",
      settings_title: "Einstellungen",
      set_size: "Logogröße",
      set_opacity: "Transparenz",
      set_rotation: "Drehung",
      set_spacing: "Abstand",
      result_title: "Ergebnis",
      result_preview: "Vorschau (erstes Foto)",
      result_download: "⬇ Alle Fotos herunterladen (ZIP)",
      result_reset: "Alles löschen",
      notice_strong: "Ehrlich:",
      notice_text: " ein sichtbares Wasserzeichen erschwert das Entfernen, macht es aber nicht unmöglich. Wiederholung über das ganze Foto ist schwerer zu entfernen als ein einzelnes Logo in einer Ecke. Für echten Herkunftsschutz ist C2PA-Metadaten nötig — bereits in modernen Kameras wie der Nikon Z9 und Canon R5 Mark II integriert.",
      footer_text: "OpenWatermark · Open Source auf",
      footer_privacy: "Deine Fotos bleiben auf deinem Gerät. Nichts wird gesendet.",
      max_photos: (max, skipped) => `Maximal ${max} Fotos pro Vorgang. ${skipped} übersprungen.`,
      photos_loaded: (n) => `${n} Foto(s) geladen.`,
      logo_loaded: "Logo geladen.",
      logo_must_be_image: "Logo muss ein Bild sein.",
      logo_load_error: "Logo konnte nicht geladen werden.",
      processing: (n) => `Verarbeite ${n} Foto(s)...`,
      creating_zip: "ZIP wird erstellt...",
      done_zip: (n) => `Fertig! ${n} Foto(s) als ZIP heruntergeladen.`,
      error_prefix: "Fehler: ",
      preview_error: "Vorschaufehler: ",
    }
  };

  const SUPPORTED = ['nl', 'en', 'de'];

  function detectLanguage() {
    // 1. Bewaar de handmatige keuze in localStorage
    const saved = localStorage.getItem('ow_lang');
    if (saved && SUPPORTED.includes(saved)) return saved;

    // 2. Gebruik browsertalen (kan meerdere zijn, in volgorde van voorkeur)
    const browserLangs = navigator.languages && navigator.languages.length
      ? navigator.languages
      : [navigator.language || 'en'];

    for (const lang of browserLangs) {
      const code = lang.toLowerCase().split('-')[0];
      if (SUPPORTED.includes(code)) return code;
    }
    return 'en';
  }

  let currentLang = detectLanguage();

  function t(key, ...args) {
    const dict = TRANSLATIONS[currentLang] || TRANSLATIONS.en;
    const val = dict[key] !== undefined ? dict[key] : TRANSLATIONS.en[key];
    return typeof val === 'function' ? val(...args) : val;
  }

  function applyTranslations() {
    document.documentElement.lang = currentLang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      el.textContent = t(key);
    });
    // Knoppen in de taalswitch markeren
    document.querySelectorAll('.lang-switch button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === currentLang);
    });
    // Documenttitel
    const titles = {
      nl: "OpenWatermark — Bescherm je foto's",
      en: "OpenWatermark — Protect your photos",
      de: "OpenWatermark — Schütze deine Fotos",
    };
    document.title = titles[currentLang] || titles.en;
  }

  function setLanguage(lang) {
    if (!SUPPORTED.includes(lang)) return;
    currentLang = lang;
    localStorage.setItem('ow_lang', lang);
    applyTranslations();
  }

  document.querySelectorAll('.lang-switch button').forEach(btn => {
    btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
  });

  applyTranslations();

  // ---------- Referenties ----------
  const photoZone = document.getElementById('photoZone');
  const photoInput = document.getElementById('photoInput');
  const photoList = document.getElementById('photoList');
  const logoZone = document.getElementById('logoZone');
  const logoInput = document.getElementById('logoInput');
  const logoInfoRow = document.getElementById('logoInfoRow');
  const logoThumb = document.getElementById('logoThumb');
  const logoName = document.getElementById('logoName');
  const changeLogoBtn = document.getElementById('changeLogoBtn');
  const controls = document.getElementById('controls');
  const resultCard = document.getElementById('resultCard');
  const preview = document.getElementById('preview');
  const statusEl = document.getElementById('status');
  const downloadZipBtn = document.getElementById('downloadZipBtn');
  const resetBtn = document.getElementById('resetBtn');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');

  const logoSize = document.getElementById('logoSize');
  const opacity = document.getElementById('opacity');
  const rotation = document.getElementById('rotation');
  const spacing = document.getElementById('spacing');

  let photos = [];
  let logoImage = null;

  // ---------- Foto's ----------
  photoZone.addEventListener('click', () => photoInput.click());
  photoInput.addEventListener('change', (e) => addPhotos(e.target.files));
  photoZone.addEventListener('dragover', (e) => { e.preventDefault(); photoZone.classList.add('dragover'); });
  photoZone.addEventListener('dragleave', () => photoZone.classList.remove('dragover'));
  photoZone.addEventListener('drop', (e) => {
    e.preventDefault();
    photoZone.classList.remove('dragover');
    addPhotos(e.dataTransfer.files);
  });

  function addPhotos(fileList) {
    const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
    if (files.length === 0) return;
    const maxPhotos = 100;
    const toAdd = files.slice(0, maxPhotos - photos.length);
    toAdd.forEach(file => photos.push({ file, id: Math.random().toString(36).slice(2) }));
    if (files.length > toAdd.length) {
      setStatus(t('max_photos', maxPhotos, files.length - toAdd.length), 'error');
    } else {
      setStatus(t('photos_loaded', photos.length));
    }
    renderPhotoList();
    updateDownloadState();
    if (logoImage && photos.length > 0) generatePreview();
  }

  function removePhoto(id) {
    photos = photos.filter(p => p.id !== id);
    renderPhotoList();
    updateDownloadState();
    if (logoImage && photos.length > 0) generatePreview();
  }

  function renderPhotoList() {
    if (photos.length === 0) {
      photoList.classList.remove('visible');
      photoList.innerHTML = '';
      return;
    }
    photoList.classList.add('visible');
    photoList.innerHTML = '';
    photos.forEach(p => {
      const item = document.createElement('div');
      item.className = 'photo-item';
      const thumb = document.createElement('img');
      thumb.className = 'thumb';
      thumb.src = URL.createObjectURL(p.file);
      thumb.onload = () => URL.revokeObjectURL(thumb.src);
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = p.file.name;
      const remove = document.createElement('div');

  function loadImage(file) {
    return new Promise((res, rej) => {

  async function applyWatermark(img) {
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const logoW = (canvas.width * parseInt(logoSize.value)) / 100;
    const logoH = (logoImage.height / logoImage.width) * logoW;
    const gap = parseInt(spacing.value);
    const rot = (parseInt(rotation.value) * Math.PI) / 180;
    const cellW = logoW + gap;
    const cellH = logoH + gap;
    const margin = Math.max(logoW, logoH);

    ctx.globalAlpha = parseInt(opacity.value) / 100;

    for (let y = -margin; y < canvas.height + margin; y += cellH) {
      for (let x = -margin; x < canvas.width + margin; x += cellW) {
        ctx.save();
        ctx.translate(x + logoW / 2, y + logoH / 2);
        ctx.rotate(rot);
        ctx.drawImage(logoImage, -logoW / 2, -logoH / 2, logoW, logoH);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;

    return new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.92));
  }
