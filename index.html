<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<title>OpenWatermark</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.2/dist/jszip.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a; --surface: #141414; --surface-2: #1c1c1c;
    --border: #262626; --text: #ededed; --text-dim: #8a8a8a;
    --accent: #f0b429; --accent-dim: #b8860b;
    --danger: #e5484d; --success: #30a46c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 16px 14px 40px; overflow-x: hidden;
  }
  header { width: 100%; max-width: 780px; margin-bottom: 20px; text-align: center; padding-top: 28px; }
  .logo { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .logo-mark {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    border-radius: 9px; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px; color: #0a0a0a;
  }
  h1 { font-size: 1.3rem; font-weight: 700; }
  .subtitle { font-size: 0.8rem; color: var(--text-dim); line-height: 1.5; max-width: 500px; margin: 0 auto; }
  .card {
    width: 100%; max-width: 780px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-bottom: 14px;
  }
  .card-title {
    font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-dim);
    margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  }
  .card-title::before { content: ''; width: 4px; height: 14px; background: var(--accent); border-radius: 2px; }
  .drop-zone {
    border: 2px dashed var(--border); border-radius: 12px;
    padding: 24px 16px; text-align: center; cursor: pointer;
    background: var(--surface-2); min-height: 100px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 6px;
  }
  .drop-zone:active { border-color: var(--accent); background: rgba(240, 180, 41, 0.06); }
  .drop-zone .icon { font-size: 1.5rem; opacity: 0.75; }
  .drop-zone .label { font-size: 0.9rem; font-weight: 500; }
  .drop-zone .hint { font-size: 0.72rem; color: var(--text-dim); }
  .photo-list { margin-top: 12px; max-height: 220px; overflow-y: auto; display: none; }
  .photo-list.visible { display: block; }
  .photo-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; background: var(--surface-2);
    border-radius: 8px; margin-bottom: 6px; font-size: 0.78rem;
  }
  .photo-item .thumb { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
  .photo-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .photo-item .remove {
    color: var(--text-dim); cursor: pointer; padding: 8px 10px;
    font-size: 1rem; min-width: 36px; min-height: 36px;
    display: flex; align-items: center; justify-content: center; border-radius: 6px;
  }
  .logo-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px; background: var(--surface-2); border-radius: 10px;
  }
  .logo-thumb {
    width: 52px; height: 52px; object-fit: contain;
    background: repeating-conic-gradient(#2a2a2a 0% 25%, #1c1c1c 0% 50%) 50% / 12px 12px;
    border-radius: 8px; border: 1px solid var(--border); padding: 4px; flex-shrink: 0;
  }
  .logo-info { flex: 1; font-size: 0.78rem; min-width: 0; }
  .logo-info .name { font-weight: 500; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .logo-info .meta { color: var(--text-dim); font-size: 0.7rem; }
  .slider-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .slider-row:last-child { border-bottom: none; }
  .slider-row label { font-size: 0.78rem; color: var(--text-dim); min-width: 88px; }
  .slider-row input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 6px; background: var(--border); border-radius: 3px; outline: none; min-width: 0;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 24px; height: 24px; background: var(--accent);
    border-radius: 50%; border: 2px solid var(--surface);
  }
  .slider-row .value {
    font-size: 0.75rem; color: var(--accent);
    min-width: 42px; text-align: right; font-weight: 600;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; padding: 15px 20px; border: none; border-radius: 12px;
    font-size: 0.92rem; font-weight: 600; cursor: pointer;
    font-family: inherit; width: 100%; min-height: 50px;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    color: #0a0a0a;
  }
  .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn-small { padding: 10px 14px; font-size: 0.78rem; width: auto; border-radius: 8px; min-height: 40px; }
  .btn-row { display: flex; gap: 10px; margin-top: 12px; }
  .preview-wrap { margin-top: 12px; }
  .preview-wrap img { width: 100%; border-radius: 10px; border: 1px solid var(--border); display: block; }
  .preview-label { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; }
  .status { font-size: 0.78rem; color: var(--text-dim); text-align: center; min-height: 1.4em; margin: 14px 0; width: 100%; max-width: 780px; }
  .status.success { color: var(--success); }
  .status.error { color: var(--danger); }
  .progress-bar { width: 100%; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 10px; display: none; }
  .progress-bar.visible { display: block; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }
  .notice {
    width: 100%; max-width: 780px; background: var(--surface);
    border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 13px 15px; font-size: 0.74rem;
    color: var(--text-dim); line-height: 1.6; margin-top: 18px;
  }
  .notice strong { color: var(--accent); font-weight: 600; }
  footer { margin-top: 26px; font-size: 0.7rem; color: var(--text-dim); text-align: center; line-height: 1.7; }
  footer a { color: var(--accent); text-decoration: none; }
  .lang-switch {
    position: fixed; top: 10px; right: 12px;
    display: flex; gap: 3px;
    background: rgba(20, 20, 20, 0.9);
    backdrop-filter: blur(10px); border: 1px solid var(--border);
    border-radius: 8px; padding: 3px; font-size: 0.7rem; z-index: 100;
  }
  .lang-switch button {
    background: transparent; border: none; color: var(--text-dim);
    cursor: pointer; padding: 6px 9px; border-radius: 6px;
    font-weight: 600; min-width: 34px;
  }
  .lang-switch button.active { background: var(--accent); color: #0a0a0a; }
  @media (max-width: 520px) {
    body { padding-left: 12px; padding-right: 12px; }
    h1 { font-size: 1.2rem; }
    .slider-row { flex-wrap: wrap; gap: 6px; }
    .slider-row label { min-width: auto; flex: 1; }
    .slider-row input[type="range"] { flex-basis: 100%; order: 3; margin-top: 2px; }
    .btn-row { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="lang-switch">
  <button data-lang="nl">NL</button>
  <button data-lang="en">EN</button>
  <button data-lang="de">DE</button>
</div>

<header>
  <div class="logo">
    <div class="logo-mark">OW</div>
    <h1>OpenWatermark</h1>
  </div>
  <p class="subtitle" data-i18n="subtitle"></p>
</header>

<div class="card">
  <div class="card-title" data-i18n="photos_title"></div>
  <div class="drop-zone" id="photoZone">
    <div class="icon">📷</div>
    <div class="label" data-i18n="photos_drop"></div>
    <div class="hint" data-i18n="photos_hint"></div>
    <input type="file" id="photoInput" accept="image/*" multiple hidden>
  </div>
  <div class="photo-list" id="photoList"></div>
</div>

<div class="card">
  <div class="card-title" data-i18n="logo_title"></div>
  <div class="drop-zone" id="logoZone">
    <div class="icon">✦</div>
    <div class="label" data-i18n="logo_drop"></div>
    <div class="hint" data-i18n="logo_hint"></div>
    <input type="file" id="logoInput" accept="image/png,image/svg+xml,image/webp" hidden>
  </div>
  <div id="logoInfoRow" style="display:none; margin-top:12px;">
    <div class="logo-row">
      <img id="logoThumb" class="logo-thumb" alt="">
      <div class="logo-info">
        <div class="name" id="logoName">logo.png</div>
        <div class="meta" data-i18n="logo_ready"></div>
      </div>
      <button class="btn btn-secondary btn-small" id="changeLogoBtn" data-i18n="logo_change"></button>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-title" data-i18n="settings_title"></div>
  <div class="controls" id="controls">
    <div class="slider-row">
      <label data-i18n="set_size"></label>
      <span class="value" id="logoSizeVal">15%</span>
      <input type="range" id="logoSize" min="5" max="40" value="15">
    </div>
    <div class="slider-row">
      <label data-i18n="set_opacity"></label>
      <span class="value" id="opacityVal">35%</span>
      <input type="range" id="opacity" min="10" max="80" value="35">
    </div>
    <div class="slider-row">
      <label data-i18n="set_rotation"></label>
      <span class="value" id="rotationVal">-30°</span>
      <input type="range" id="rotation" min="-60" max="0" value="-30">
    </div>
    <div class="slider-row">
      <label data-i18n="set_spacing"></label>
      <span class="value" id="spacingVal">220</span>
      <input type="range" id="spacing" min="100" max="500" value="220">
    </div>
  </div>
</div>

<div class="card" id="resultCard" style="display:none;">
  <div class="card-title" data-i18n="result_title"></div>
  <div class="preview-wrap" id="previewWrap">
    <div class="preview-label" data-i18n="result_preview"></div>
    <img id="preview" alt="">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="downloadZipBtn" data-i18n="result_download"></button>
  </div>
  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="resetBtn" data-i18n="result_reset"></button>
  </div>
</div>

<div class="status" id="status"></div>

<div class="notice">
  <strong data-i18n="notice_strong"></strong>
  <span data-i18n="notice_text"></span>
</div>

<footer>
  <span data-i18n="footer_text"></span>
  <a href="https://github.com/keyzerphotos/OpenWatermark">GitHub</a><br>
  <span data-i18n="footer_privacy"></span>
</footer>

<script src="app.js"></script>

</body>
</html>
