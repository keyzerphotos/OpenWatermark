<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>OpenWatermark — Bescherm je foto's</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.2/dist/jszip.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-2: #1c1c1c;
    --border: #262626;
    --text: #ededed;
    --text-dim: #8a8a8a;
    --accent: #f0b429;
    --accent-dim: #b8860b;
    --danger: #e5484d;
    --success: #30a46c;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(16px + var(--safe-top)) 14px calc(40px + var(--safe-bottom));
    overscroll-behavior-y: contain;
  }

  /* Header */
  header { width: 100%; max-width: 780px; margin-bottom: 22px; text-align: center; position: relative; padding-top: 4px; }
  .logo { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .logo-mark {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px; color: #0a0a0a;
    box-shadow: 0 4px 16px rgba(240, 180, 41, 0.2);
  }
  h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
  .subtitle {
    font-size: 0.8rem; color: var(--text-dim);
    line-height: 1.5; max-width: 500px; margin: 0 auto;
  }

  /* Cards */
  .card {
    width: 100%; max-width: 780px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 0.72rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-dim); margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title::before {
    content: ''; width: 4px; height: 14px;
    background: var(--accent); border-radius: 2px;
  }

  /* Drop zones */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 26px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--surface-2);
    min-height: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .drop-zone:hover, .drop-zone.dragover, .drop-zone:active {
    border-color: var(--accent);
    background: rgba(240, 180, 41, 0.06);
  }
  .drop-zone .icon { font-size: 1.5rem; opacity: 0.75; }
  .drop-zone .label { font-size: 0.9rem; font-weight: 500; color: var(--text); }
  .drop-zone .hint { font-size: 0.72rem; color: var(--text-dim); }

  /* Photo list */
  .photo-list {
    margin-top: 12px;
    max-height: 220px;
    overflow-y: auto;
    display: none;
    -webkit-overflow-scrolling: touch;
  }
  .photo-list.visible { display: block; }
  .photo-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    background: var(--surface-2);
    border-radius: 8px; margin-bottom: 6px;
    font-size: 0.78rem;
  }
  .photo-item .thumb {
    width: 34px; height: 34px; border-radius: 6px;
    object-fit: cover; background: #000; flex-shrink: 0;
  }
  .photo-item .name {
    flex: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .photo-item .remove {
    color: var(--text-dim); cursor: pointer;
    padding: 8px 10px; font-size: 1rem; line-height: 1;
    min-width: 36px; min-height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
  }
  .photo-item .remove:active { background: rgba(229, 72, 77, 0.15); color: var(--danger); }

  /* Logo row */
  .logo-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px; background: var(--surface-2); border-radius: 10px;
  }
  .logo-thumb {
    width: 52px; height: 52px; object-fit: contain;
    background: repeating-conic-gradient(#2a2a2a 0% 25%, #1c1c1c 0% 50%) 50% / 12px 12px;
    border-radius: 8px; border: 1px solid var(--border);
    padding: 4px; flex-shrink: 0;
  }
  .logo-info { flex: 1; font-size: 0.78rem; min-width: 0; }
  .logo-info .name {
    color: var(--text); font-weight: 500; margin-bottom: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .logo-info .meta { color: var(--text-dim); font-size: 0.7rem; }

  /* Sliders */
  .slider-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .slider-row:last-child { border-bottom: none; }
  .slider-row label {
    font-size: 0.78rem; color: var(--text-dim);
    min-width: 88px; flex-shrink: 0;
  }
  .slider-row input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 6px; background: var(--border);
    border-radius: 3px; outline: none;
    min-width: 0;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 24px; height: 24px; background: var(--accent);
    border-radius: 50%; cursor: pointer;
    box-shadow: 0 2px 8px rgba(240, 180, 41, 0.3);
    border: 2px solid var(--surface);
  }
  .slider-row input[type="range"]::-moz-range-thumb {
    width: 24px; height: 24px; background: var(--accent);
    border-radius: 50%; cursor: pointer; border: 2px solid var(--surface);
  }
  .slider-row .value {
    font-size: 0.75rem; color: var(--accent);
    min-width: 42px; text-align: right;
    font-variant-numeric: tabular-nums; font-weight: 600;
  }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; padding: 15px 20px;
    border: none; border-radius: 12px;
    font-size: 0.92rem; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
    font-family: inherit; width: 100%;
    min-height: 50px;
    touch-action: manipulation;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    color: #0a0a0a;
    box-shadow: 0 4px 16px rgba(240, 180, 41, 0.25);
  }
  .btn-secondary {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-small {
    padding: 10px 14px; font-size: 0.78rem;
    width: auto; border-radius: 8px; min-height: 40px;
  }
  .btn-row { display: flex; gap: 10px; margin-top: 12px; }

  /* Preview */
  .preview-wrap { margin-top: 12px; }
  .preview-wrap img {
    width: 100%; border-radius: 10px;
    border: 1px solid var(--border);
    display: block;
  }
  .preview-label {
    font-size: 0.7rem; color: var(--text-dim);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em;
  }

  /* Status */
  .status {
    font-size: 0.78rem; color: var(--text-dim);
    text-align: center; min-height: 1.4em;
    margin: 14px 0; width: 100%; max-width: 780px;
    padding: 0 8px;
  }
  .status.success { color: var(--success); }
  .status.error { color: var(--danger); }

  /* Progress */
  .progress-bar {
    width: 100%; height: 5px; background: var(--border);
    border-radius: 3px; overflow: hidden;
    margin-top: 10px; display: none;
  }
  .progress-bar.visible { display: block; }
  .progress-fill {
    height: 100%; background: var(--accent);
    width: 0%; transition: width 0.2s;
  }

  /* Notice */
  .notice {
    width: 100%; max-width: 780px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 13px 15px;
    font-size: 0.74rem; color: var(--text-dim);
    line-height: 1.6; margin-top: 18px;
  }
  .notice strong { color: var(--accent); font-weight: 600; }

  /* Footer */
  footer {
    margin-top: 26px; font-size: 0.7rem;
    color: var(--text-dim); text-align: center; line-height: 1.7;
    padding: 0 8px;
  }
  footer a { color: var(--accent); text-decoration: none; }

  /* Language switch */
  .lang-switch {
    position: fixed;
    top: calc(10px + var(--safe-top));
    right: 12px;
    display: flex; gap: 3px;
    background: rgba(20, 20, 20, 0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 3px;
    font-size: 0.7rem;
    z-index: 100;
  }
  .lang-switch button {
    background: transparent; border: none;
    color: var(--text-dim); cursor: pointer;
    padding: 6px 9px; border-radius: 6px;
    font-family: inherit; font-size: inherit;
    font-weight: 600; transition: all 0.15s;
    min-width: 34px;
  }
  .lang-switch button.active {
    background: var(--accent); color: #0a0a0a;
  }

  /* ---------- Mobiel: kleine schermen ---------- */
  @media (max-width: 520px) {
    body { padding-left: 12px; padding-right: 12px; }
    h1 { font-size: 1.2rem; }
    .subtitle { font-size: 0.76rem; }
    .card { padding: 14px; border-radius: 12px; }
    .drop-zone { padding: 22px 12px; min-height: 100px; }
    .drop-zone .label { font-size: 0.85rem; }
    .drop-zone .hint { font-size: 0.68rem; }

    /* Sliders onder elkaar op mobiel */
    .slider-row {
      flex-wrap: wrap;
      padding: 10px 0;
      gap: 6px;
    }
    .slider-row label {
      min-width: auto;
      flex: 1;
      font-size: 0.76rem;
    }
    .slider-row .value {
      min-width: auto;
      text-align: right;
    }
    .slider-row input[type="range"] {
      flex-basis: 100%;
      order: 3;
      margin-top: 2px;
    }

    /* Knoppen onder elkaar */
    .btn-row { flex-direction: column; }
    .btn-row .btn { width: 100%; }

    /* Taal-switch compacter */
    .lang-switch { font-size: 0.66rem; padding: 2px; }
    .lang-switch button { padding: 5px 7px; min-width: 30px; }

    /* Logo-rij compacter */
    .logo-row { padding: 8px; gap: 10px; }
    .logo-thumb { width: 44px; height: 44px; }

    /* Foto-lijst iets compacter */
    .photo-item { padding: 6px 8px; }
    .photo-item .thumb { width: 30px; height: 30px; }
    .photo-item .name { font-size: 0.74rem; }

    .notice { font-size: 0.7rem; padding: 12px 13px; }
    footer { font-size: 0.66rem; }
  }

  /* Hele kleine schermen (oude telefoons) */
  @media (max-width: 360px) {
    h1 { font-size: 1.1rem; }
    .subtitle { font-size: 0.72rem; }
    .card { padding: 12px; }
    .drop-zone { padding: 18px 10px; min-height: 90px; }
    .slider-row label { font-size: 0.72rem; }
    .slider-row .value { font-size: 0.7rem; }
    .btn { font-size: 0.86rem; padding: 14px; min-height: 48px; }
  }

  /* Voorkom iOS zoom bij input focus */
  input[type="range"], button, .drop-zone { font-size: 16px; }
  input, select, textarea { font-size: 16px; }

  /* Landscape op telefoon */
  @media (max-height: 500px) and (orientation: landscape) {
    body { padding-top: 12px; }
    header { margin-bottom: 12px; }
    .card { padding: 12px; margin-bottom: 10px; }
    .drop-zone { padding: 16px 12px; min-height: 80px; }
  }
</style>
</head>
<body>

<div class="lang-switch">
  <button data-lang="nl">NL</button>
  <button data-lang="en">EN</button>
  <button data-lang="de">DE</button>
</div>

<header>
  <div class="logo">
    <div class="logo-mark">OW</div>
    <h1>OpenWatermark</h1>
  </div>
  <p class="subtitle" data-i18n="subtitle"></p>
</header>

<div class="card">
  <div class="card-title" data-i18n="photos_title"></div>
  <div class="drop-zone" id="photoZone">
    <div class="icon">📷</div>
    <div class="label" data-i18n="photos_drop"></div>
    <div class="hint" data-i18n="photos_hint"></div>
    <input type="file" id="photoInput" accept="image/*" multiple hidden>
  </div>
  <div class="photo-list" id="photoList"></div>
</div>

<div class="card">
  <div class="card-title" data-i18n="logo_title"></div>
  <div class="drop-zone" id="logoZone">
    <div class="icon">✦</div>
    <div class="label" data-i18n="logo_drop"></div>
    <div class="hint" data-i18n="logo_hint"></div>
    <input type="file" id="logoInput" accept="image/png,image/svg+xml,image/webp" hidden>
  </div>
  <div id="logoInfoRow" style="display:none; margin-top:12px;">
    <div class="logo-row">
      <img id="logoThumb" class="logo-thumb" alt="">
      <div class="logo-info">
        <div class="name" id="logoName">logo.png</div>
        <div class="meta" data-i18n="logo_ready"></div>
      </div>
      <button class="btn btn-secondary btn-small" id="changeLogoBtn" data-i18n="logo_change"></button>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-title" data-i18n="settings_title"></div>
  <div class="controls" id="controls">
    <div class="slider-row">
      <label data-i18n="set_size"></label>
      <span class="value" id="logoSizeVal">15%</span>
      <input type="range" id="logoSize" min="5" max="40" value="15">
    </div>
    <div class="slider-row">
      <label data-i18n="set_opacity"></label>
      <span class="value" id="opacityVal">35%</span>
      <input type="range" id="opacity" min="10" max="80" value="35">
    </div>
    <div class="slider-row">
      <label data-i18n="set_rotation"></label>
      <span class="value" id="rotationVal">-30°</span>
      <input type="range" id="rotation" min="-60" max="0" value="-30">
    </div>
    <div class="slider-row">
      <label data-i18n="set_spacing"></label>
      <span class="value" id="spacingVal">220</span>
      <input type="range" id="spacing" min="100" max="500" value="220">
    </div>
  </div>
</div>

<div class="card" id="resultCard" style="display:none;">
  <div class="card-title" data-i18n="result_title"></div>
  <div class="preview-wrap" id="previewWrap">
    <div class="preview-label" data-i18n="result_preview"></div>
    <img id="preview" alt="">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="downloadZipBtn" data-i18n="result_download"></button>
  </div>
  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="resetBtn" data-i18n="result_reset"></button>
  </div>
</div>

<div class="status" id="status"></div>

<div class="notice">
  <strong data-i18n="notice_strong"></strong>
  <span data-i18n="notice_text"></span>
</div>

<footer>
  <span data-i18n="footer_text"></span>
  <a href="https://github.com/keyzerphotos/OpenWatermark">GitHub</a><br>
  <span data-i18n="footer_privacy"></span>
</footer>

<script>
(function() {
  'use strict';

  const TRANSLATIONS = {
    nl: {
      subtitle: "Bescherm je foto's met je eigen logo. Alles lokaal in je browser — niets wordt geüpload.",
      photos_title: "Foto's",
      photos_drop: "Tik om foto's te kiezen",
      photos_hint: "meerdere foto's mogelijk",
      logo_title: "Jouw logo",
      logo_drop: "Tik om je logo te kiezen",
      logo_hint: "PNG met transparante achtergrond werkt het best",
      logo_ready: "Klaar voor gebruik",
      logo_change: "Wijzigen",
      settings_title: "Instellingen",
      set_size: "Logogrootte",
      set_opacity: "Transparantie",
      set_rotation: "Rotatie",
      set_spacing: "Afstand",
      result_title: "Resultaat",
      result_preview: "Voorbeeld (eerste foto)",
      result_download: "⬇ Download alle foto's (ZIP)",
      result_reset: "Alles wissen",
      notice_strong: "Eerlijk:",
      notice_text: " een zichtbaar watermerk maakt verwijdering lastiger, maar niet onmogelijk. Herhaling over de hele foto is moeilijker weg te poetsen dan één logo in een hoek. Voor echte herkomstbescherming is C2PA-metadata nodig — dat zit al in moderne camera's zoals Nikon Z9 en Canon R5 Mark II.",
      footer_text: "OpenWatermark · Open source op",
      footer_privacy: "Je foto's blijven op je toestel. Niets wordt verstuurd.",
      max_photos: (max, skipped) => `Maximaal ${max} foto's per keer. ${skipped} overgeslagen.`,
      photos_loaded: (n) => `${n} foto('s) geladen.`,
      logo_loaded: "Logo geladen.",
      logo_must_be_image: "Logo moet een afbeelding zijn.",
      logo_load_error: "Logo kon niet geladen worden.",
      processing: (n) => `Bezig met ${n} foto('s)...`,
      creating_zip: "ZIP maken...",
      done_zip: (n) => `Klaar! ${n} foto('s) gedownload als ZIP.`,
      error_prefix: "Fout: ",
      preview_error: "Fout bij voorbeeld: ",
    },
    en: {
      subtitle: "Protect your photos with your own logo. Everything local in your browser — nothing is uploaded.",
      photos_title: "Photos",
      photos_drop: "Tap to choose photos",
      photos_hint: "multiple photos allowed",
      logo_title: "Your logo",
      logo_drop: "Tap to choose your logo",
      logo_hint: "PNG with transparent background works best",
      logo_ready: "Ready to use",
      logo_change: "Change",
      settings_title: "Settings",
      set_size: "Logo size",
      set_opacity: "Opacity",
      set_rotation: "Rotation",
      set_spacing: "Spacing",
      result_title: "Result",
      result_preview: "Preview (first photo)",
      result_download: "⬇ Download all photos (ZIP)",
      result_reset: "Clear all",
      notice_strong: "Honest:",
      notice_text: " a visible watermark makes removal harder, but not impossible. Repeating across the whole photo is harder to erase than a single logo in a corner. For real provenance protection, C2PA metadata is needed — already built into modern cameras like the Nikon Z9 and Canon R5 Mark II.",
      footer_text: "OpenWatermark · Open source on",
      footer_privacy: "Your photos stay on your device. Nothing is sent.",
      max_photos: (max, skipped) => `Maximum ${max} photos at a time. ${skipped} skipped.`,
      photos_loaded: (n) => `${n} photo(s) loaded.`,
      logo_loaded: "Logo loaded.",
      logo_must_be_image: "Logo must be an image.",
      logo_load_error: "Logo could not be loaded.",
      processing: (n) => `Processing ${n} photo(s)...`,
      creating_zip: "Creating ZIP...",
      done_zip: (n) => `Done! ${n} photo(s) downloaded as ZIP.`,
      error_prefix: "Error: ",
      preview_error: "Preview error: ",
    },
    de: {
      subtitle: "Schütze deine Fotos mit deinem eigenen Logo. Alles lokal im Browser — nichts wird hochgeladen.",
      photos_title: "Fotos",
      photos_drop: "Tippe, um Fotos auszuwählen",
      photos_hint: "mehrere Fotos möglich",
      logo_title: "Dein Logo",
      logo_drop: "Tippe, um dein Logo auszuwählen",
      logo_hint: "PNG mit transparentem Hintergrund funktioniert am besten",
      logo_ready: "Bereit zur Verwendung",
      logo_change: "Ändern",
      settings_title: "Einstellungen",
      set_size: "Logogröße",
      set_opacity: "Transparenz",
      set_rotation: "Drehung",
      set_spacing: "Abstand",
      result_title: "Ergebnis",
      result_preview: "Vorschau (erstes Foto)",
      result_download: "⬇ Alle Fotos herunterladen (ZIP)",
      result_reset: "Alles löschen",
      notice_strong: "Ehrlich:",
      notice_text: " ein sichtbares Wasserzeichen erschwert das Entfernen, macht es aber nicht unmöglich. Wiederholung über das ganze Foto ist schwerer zu entfernen als ein einzelnes Logo in einer Ecke. Für echten Herkunftsschutz ist C2PA-Metadaten nötig — bereits in modernen Kameras wie der Nikon Z9 und Canon R5 Mark II integriert.",
      footer_text: "OpenWatermark · Open Source auf",
      footer_privacy: "Deine Fotos bleiben auf deinem Gerät. Nichts wird gesendet.",
      max_photos: (max, skipped) => `Maximal ${max} Fotos pro Vorgang. ${skipped} übersprungen.`,
      photos_loaded: (n) => `${n} Foto(s) geladen.`,
      logo_loaded: "Logo geladen.",
      logo_must_be_image: "Logo muss ein Bild sein.",
      logo_load_error: "Logo konnte nicht geladen werden.",
      processing: (n) => `Verarbeite ${n} Foto(s)...`,
      creating_zip: "ZIP wird erstellt...",
      done_zip: (n) => `Fertig! ${n} Foto(s) als ZIP heruntergeladen.`,
      error_prefix: "Fehler: ",
      preview_error: "Vorschaufehler: ",
    }
  };

  const SUPPORTED = ['nl', 'en', 'de'];

  function detectLanguage() {
    const saved = localStorage.getItem('ow_lang');
    if (saved && SUPPORTED.includes(saved)) return saved;
    const browserLangs = navigator.languages && navigator.languages.length
      ? navigator.languages
      : [navigator.language || 'en'];
    for (const lang of browserLangs) {
      const code = lang.toLowerCase().split('-')[0];
      if (SUPPORTED.includes(code)) return code;
    }
    return 'en';
  }

  let currentLang = detectLanguage();

  function t(key, ...args) {
    const dict = TRANSLATIONS[currentLang] || TRANSLATIONS.en;
    const val = dict[key] !== undefined ? dict[key] : TRANSLATIONS.en[key];
    return typeof val === 'function' ? val(...args) : val;
  }

  function applyTranslations() {
    document.documentElement.lang = currentLang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      el.textContent = t(key);
    });
    document.querySelectorAll('.lang-switch button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === currentLang);
    });
    const titles = {
      nl: "OpenWatermark — Bescherm je foto's",
      en: "OpenWatermark — Protect your photos",
      de: "OpenWatermark — Schütze deine Fotos",
    };
    document.title = titles[currentLang] || titles.en;
  }

  function setLanguage(lang) {
    if (!SUPPORTED.includes(lang)) return;
    currentLang = lang;
    localStorage.setItem('ow_lang', lang);
    applyTranslations();
  }

  document.querySelectorAll('.lang-switch button').forEach(btn => {
    btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
  });

  applyTranslations();

  // ---------- Elementen ----------
  const photoZone = document.getElementById('photoZone');
  const photoInput = document.getElementById('photoInput');
  const photoList = document.getElementById('photoList');
  const logoZone = document.getElementById('logoZone');
  const logoInput = document.getElementById('logoInput');
  const logoInfoRow = document.getElementById('logoInfoRow');
  const logoThumb = document.getElementById('logoThumb');
  const logoName = document.getElementById('logoName');
  const changeLogoBtn = document.getElementById('changeLogoBtn');
  const resultCard = document.getElementById('resultCard');
  const preview = document.getElementById('preview');
  const statusEl = document.getElementById('status');
  const downloadZipBtn = document.getElementById('downloadZipBtn');
  const resetBtn = document.getElementById('resetBtn');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');

  const logoSize = document.getElementById('logoSize');
  const opacity = document.getElementById('opacity');
  const rotation = document.getElementById('rotation');
  const spacing = document.getElementById('spacing');

  let photos = [];
  let logoImage = null;

  // ---------- Foto's ----------
  photoZone.addEventListener('click', () => photoInput.click());
  photoInput.addEventListener('change', (e) => addPhotos(e.target.files));
  photoZone.addEventListener('dragover', (e) => { e.preventDefault(); photoZone.classList.add('dragover'); });
  photoZone.addEventListener('dragleave', () => photoZone.classList.remove('dragover'));
  photoZone.addEventListener('drop', (e) => {
    e.preventDefault();
    photoZone.classList.remove('dragover');
    addPhotos(e.dataTransfer.files);
  });

  function addPhotos(fileList) {
    const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
    if (files.length === 0) return;
    const maxPhotos = 100;
    const toAdd = files.slice(0, maxPhotos - photos.length);
    toAdd.forEach(file => photos.push({ file, id: Math.random().toString(36).slice(2) }));
    if (files.length > toAdd.length) {
      setStatus(t('max_photos', maxPhotos, files.length - toAdd.length), 'error');
    } else {
      setStatus(t('photos_loaded', photos.length));
    }
    renderPhotoList();
    updateDownloadState();
    if (logoImage && photos.length > 0) generatePreview();
  }

  function removePhoto(id) {
    photos = photos.filter(p => p.id !== id);
    renderPhotoList();
    updateDownloadState();
    if (logoImage && photos.length > 0) generatePreview();
  }

  function renderPhotoList() {
    if (photos.length === 0) {
      photoList.classList.remove('visible');
      photoList.innerHTML = '';
      return;
    }
    photoList.classList.add('visible');
    photoList.innerHTML = '';
    photos.forEach(p => {
      const item = document.createElement('div');
      item.className = 'photo-item';
      const thumb = document.createElement('img');
      thumb.className = 'thumb';
      thumb.src = URL.createObjectURL(p.file);
      thumb.onload = () => URL.revokeObjectURL(thumb.src);
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = p.file.name;
      const remove = document.createElement('div');
      remove.className = 'remove';
      remove.textContent = '✕';
      remove.addEventListener('click', (e) => { e.stopPropagation(); removePhoto(p.id); });
      item.appendChild(thumb);
      item.appendChild(name);
      item.appendChild(remove);
      photoList.appendChild(item);
    });
  }

  // ---------- Logo ----------
  logoZone.addEventListener('click', () => logoInput.click());
  changeLogoBtn.addEventListener('click', (e) => { e.stopPropagation(); logoInput.click(); });
  logoInput.addEventListener('change', (e) => { if (e.target.files[0]) loadLogo(e.target.files[0]); });
  logoZone.addEventListener('dragover', (e) => { e.preventDefault(); logoZone.classList.add('dragover'); });
  logoZone.addEventListener('dragleave', () => logoZone.classList.remove('dragover'));
  logoZone.addEventListener('drop', (e) => {
    e.preventDefault();
    logoZone.classList.remove('dragover');
    if (e.dataTransfer.files[0]) loadLogo(e.dataTransfer.files[0]);
  });
