<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OpenWatermark</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f0b429'/%3E%3Ctext x='50' y='68' font-family='sans-serif' font-size='54' font-weight='800' text-anchor='middle' fill='%2308080a'%3EOW%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.2/dist/jszip.min.js"></script>
<style>
  :root {
    --bg: #08080a;
    --surface: #111114;
    --surface-2: #17171c;
    --surface-3: #1f1f26;
    --border: #26262e;
    --text: #f2f2f5;
    --text-dim: #8a8a96;
    --text-muted: #5a5a66;
    --accent: #f0b429;
    --accent-hi: #ffc94a;
    --accent-dim: #b8860b;
    --accent-glow: rgba(240, 180, 41, 0.15);
    --success: #34d399;
    --success-glow: rgba(52, 211, 153, 0.25);
    --warning: #fbbf24;
    --danger: #f87171;
    --radius: 14px;
    --radius-sm: 10px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .wrapper {
    max-width: 720px;
    margin: 0 auto;
    padding: calc(24px + var(--safe-top)) 16px calc(60px + var(--safe-bottom));
  }

  /* ---------- Header ---------- */
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .logo-mark {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, var(--accent-hi), var(--accent-dim));
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 17px;
    color: #08080a;
    box-shadow: 0 4px 20px var(--accent-glow);
    letter-spacing: -0.02em;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  .subtitle {
    font-size: 0.85rem;
    color: var(--text-dim);
    line-height: 1.55;
    max-width: 460px;
    margin: 0 auto;
  }

  /* ---------- Stap-indicator ---------- */
  .steps {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding: 0 8px;
    position: relative;
  }
  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    position: relative;
    z-index: 2;
    flex: 1;
  }
  .step-dot {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--surface-2);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-muted);
    transition: all 0.25s;
  }
  .step-label {
    font-size: 0.62rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    transition: color 0.25s;
  }
  .step.active .step-dot {
    background: var(--accent);
    border-color: var(--accent);
    color: #08080a;
    box-shadow: 0 0 0 4px var(--accent-glow);
  }
  .step.active .step-label { color: var(--accent); }
  .step.done .step-dot {
    background: var(--success);
    border-color: var(--success);
    color: #08080a;
  }
  .step.done .step-label { color: var(--success); }
  .steps::before {
    content: '';
    position: absolute;
    top: 15px;
    left: 10%;
    right: 10%;
    height: 2px;
    background: var(--border);
    z-index: 1;
  }

  /* ---------- Kaarten ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 14px;
    transition: border-color 0.25s, opacity 0.25s;
  }
  .card.locked {
    opacity: 0.4;
    pointer-events: none;
  }
  .card.done {
    border-color: rgba(52, 211, 153, 0.3);
  }

  .card-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .card-num {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: var(--surface-3);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 800;
    flex-shrink: 0;
  }
  .card.done .card-num {
    background: var(--success);
    color: #08080a;
  }
  .card-title {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .card-hint {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 2px;
    font-weight: 500;
  }

  /* ---------- Drop zones ---------- */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius-sm);
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    background: var(--surface-2);
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 120px;
  }
  .drop-zone:active {
    border-color: var(--accent);
    background: rgba(240, 180, 41, 0.05);
  }
  .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(240, 180, 41, 0.08);
  }
  .drop-icon { font-size: 1.8rem; opacity: 0.8; }
  .drop-label { font-size: 0.92rem; font-weight: 600; }
  .drop-hint { font-size: 0.72rem; color: var(--text-muted); }

  /* ---------- Foto-lijst ---------- */
  .photo-list {
    margin-top: 12px;
    max-height: 240px;
    overflow-y: auto;
    display: none;
  }
  .photo-list.visible { display: block; }
  .photo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: var(--surface-2);
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 0.78rem;
  }
  .photo-item .thumb {
    width: 36px; height: 36px;
    border-radius: 6px; object-fit: cover;
    background: #000; flex-shrink: 0;
  }
  .photo-item .name {
    flex: 1; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .photo-item .remove {
    color: var(--text-muted);
    cursor: pointer;
    padding: 6px 8px;
    font-size: 1rem;
    border-radius: 6px;
    transition: all 0.15s;
    min-width: 34px; min-height: 34px;
    display: flex; align-items: center; justify-content: center;
  }
  .photo-item .remove:active {
    background: rgba(248, 113, 113, 0.15);
    color: var(--danger);
  }

  /* Foto-teller */
  .photo-counter {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 8px;
    text-align: center;
    padding: 6px 10px;
    background: var(--surface-2);
    border-radius: 8px;
    display: none;
  }
  .photo-counter.visible { display: block; }
  .photo-counter strong { color: var(--accent); }

  /* ---------- Logo ---------- */
  .logo-row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
  }
  .logo-thumb {
    width: 56px; height: 56px; object-fit: contain;
    background: repeating-conic-gradient(#1f1f26 0% 25%, #17171c 0% 50%) 50% / 12px 12px;
    border-radius: 8px; border: 1px solid var(--border);
    padding: 4px; flex-shrink: 0;
  }
  .logo-info { flex: 1; min-width: 0; font-size: 0.8rem; }
  .logo-info .name {
    font-weight: 600; margin-bottom: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .logo-info .meta { color: var(--text-muted); font-size: 0.7rem; }

  /* ---------- Sliders ---------- */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .slider-row:last-child { border-bottom: none; }
  .slider-row label {
    font-size: 0.82rem;
    color: var(--text-dim);
    min-width: 100px;
    font-weight: 500;
    flex-shrink: 0;
  }
  .slider-row input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    min-width: 0;
    touch-action: pan-y;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 28px;
    height: 28px;
    background: var(--accent);
    border-radius: 50%;
    border: 2px solid var(--surface);
    box-shadow: 0 2px 8px var(--accent-glow);
    cursor: pointer;
  }
  .slider-row input[type="range"]::-moz-range-thumb {
    width: 28px;
    height: 28px;
    background: var(--accent);
    border-radius: 50%;
    border: 2px solid var(--surface);
    cursor: pointer;
  }
  .slider-row .value {
    font-size: 0.75rem;
    color: var(--accent);
    min-width: 46px;
    text-align: right;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  /* ---------- Text input ---------- */
  .text-input {
    flex: 1;
    padding: 10px 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    transition: border-color 0.15s;
    min-width: 0;
  }
  .text-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .field-hint {
    font-size: 0.68rem;
    color: var(--text-muted);
    line-height: 1.5;
    margin-top: 6px;
    padding-left: 2px;
  }

  /* ---------- Preview ---------- */
  .preview-wrap {
    border-radius: var(--radius-sm);
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface-2);
  }
  .preview-wrap img { width: 100%; display: block; }
  .preview-label {
    font-size: 0.68rem;
    color: var(--text-muted);
    padding: 8px 12px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .preview-empty {
    padding: 32px 16px;
    text-align: center;
    font-size: 0.78rem;
    color: var(--text-muted);
    line-height: 1.6;
    display: block;
  }
  .preview-empty.hidden { display: none; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 15px 22px;
    border: none;
    border-radius: 12px;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    width: 100%;
    min-height: 50px;
    letter-spacing: -0.01em;
    position: relative;
  }
  .btn:active { transform: scale(0.985); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent-hi), var(--accent-dim));
    color: #08080a;
    box-shadow: 0 4px 20px var(--accent-glow);
  }
  .btn-primary.success-flash {
    background: linear-gradient(135deg, var(--success), #059669);
    box-shadow: 0 4px 20px var(--success-glow);
  }
  .btn-secondary {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-small {
    padding: 9px 14px;
    font-size: 0.78rem;
    width: auto;
    min-height: 40px;
    border-radius: 9px;
    flex-shrink: 0;
  }

  /* ---------- Actiebalk ---------- */
  .action-bar {
    display: none;
    margin-top: 20px;
  }
  .action-bar.visible { display: block; }
  .action-bar-inner {
    display: flex;
    gap: 10px;
  }
  .action-bar .btn { flex: 1; }

  /* ---------- Status ---------- */
  .status {
    font-size: 0.82rem;
    color: var(--text-dim);
    text-align: center;
    min-height: 1.4em;
    margin: 16px 0;
    padding: 0 12px;
    transition: color 0.2s;
  }
  .status.success { color: var(--success); font-weight: 600; }
  .status.error { color: var(--danger); font-weight: 600; }
  .status.warning { color: var(--warning); font-weight: 600; }

  /* ---------- Progress ---------- */
  .progress-bar {
    width: 100%;
    height: 5px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 12px;
    display: none;
  }
  .progress-bar.visible { display: block; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-hi));
    width: 0%;
    transition: width 0.2s;
  }

  /* ---------- Notice ---------- */
  .notice {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 0.75rem;
    color: var(--text-dim);
    line-height: 1.6;
    margin-top: 20px;
  }
  .notice strong { color: var(--accent); font-weight: 700; }

  /* ---------- Waarschuwing ---------- */
  .alert {
    display: none;
    background: rgba(251, 191, 36, 0.08);
    border: 1px solid rgba(251, 191, 36, 0.3);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.74rem;
    color: var(--warning);
    line-height: 1.5;
    margin-bottom: 14px;
  }
  .alert.visible { display: block; }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 28px;
    font-size: 0.7rem;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.7;
    padding: 0 12px;
  }
  footer a { color: var(--accent); text-decoration: none; }

  /* ---------- Mobiel ---------- */
  @media (max-width: 520px) {
    .wrapper { padding-left: 12px; padding-right: 12px; }
    h1 { font-size: 1.3rem; }
    .subtitle { font-size: 0.78rem; }
    .card { padding: 16px; }

    .slider-row { flex-wrap: wrap; gap: 8px; }
    .slider-row label { min-width: auto; flex: 1; font-size: 0.78rem; }
    .slider-row input[type="range"] { flex-basis: 100%; order: 3; }

    .step-label { font-size: 0.56rem; }
    .step-dot { width: 26px; height: 26px; font-size: 0.7rem; }
    .steps::before { top: 13px; }

    .drop-zone { padding: 24px 16px; min-height: 104px; }
    .drop-label { font-size: 0.86rem; }

    .action-bar-inner { flex-direction: column; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="wrapper">

  <header>
    <div class="logo">
      <div class="logo-mark">OW</div>
      <h1>OpenWatermark</h1>
    </div>
    <p class="subtitle" data-i18n="subtitle"></p>
  </header>

  <div class="steps" id="steps">
    <div class="step" data-step="1">
      <div class="step-dot">1</div>
      <div class="step-label" data-i18n="step_photos"></div>
    </div>
    <div class="step" data-step="2">
      <div class="step-dot">2</div>
      <div class="step-label" data-i18n="step_logo"></div>
    </div>
    <div class="step" data-step="3">
      <div class="step-dot">3</div>
      <div class="step-label" data-i18n="step_settings"></div>
    </div>
    <div class="step" data-step="4">
      <div class="step-dot">4</div>
      <div class="step-label" data-i18n="step_download"></div>
    </div>
  </div>

  <!-- Waarschuwing als onzichtbare laag niet geladen is -->
  <div class="alert" id="invisibleAlert" data-i18n="invisible_alert"></div>

  <!-- Stap 1: Foto's -->
  <div class="card" id="cardPhotos">
    <div class="card-head">
      <div class="card-num">1</div>
      <div>
        <div class="card-title" data-i18n="photos_title"></div>
        <div class="card-hint" data-i18n="photos_hint_card"></div>
      </div>
    </div>
    <div class="drop-zone" id="photoZone">
      <div class="drop-icon">📷</div>
      <div class="drop-label" data-i18n="photos_drop"></div>
      <div class="drop-hint" data-i18n="photos_hint"></div>
      <input type="file" id="photoInput" accept="image/*" multiple hidden>
    </div>
    <div class="photo-list" id="photoList"></div>
    <div class="photo-counter" id="photoCounter"></div>
  </div>

  <!-- Stap 2: Logo -->
  <div class="card locked" id="cardLogo">
    <div class="card-head">
      <div class="card-num">2</div>
      <div>
        <div class="card-title" data-i18n="logo_title"></div>
        <div class="card-hint" data-i18n="logo_hint_card"></div>
      </div>
    </div>
    <div class="drop-zone" id="logoZone">
      <div class="drop-icon">✦</div>
      <div class="drop-label" data-i18n="logo_drop"></div>
      <div class="drop-hint" data-i18n="logo_hint"></div>
      <input type="file" id="logoInput" accept="image/png,image/svg+xml,image/webp" hidden>
    </div>
    <div id="logoInfoRow" style="display:none; margin-top:12px;">
      <div class="logo-row">
        <img id="logoThumb" class="logo-thumb" alt="">
        <div class="logo-info">
          <div class="name" id="logoName">logo.png</div>
          <div class="meta" data-i18n="logo_ready"></div>
        </div>
        <button class="btn btn-secondary btn-small" id="changeLogoBtn" data-i18n="logo_change"></button>
      </div>
    </div>
  </div>

  <!-- Stap 3: Instellingen -->
  <div class="card locked" id="cardSettings">
    <div class="card-head">
      <div class="card-num">3</div>
      <div>
        <div class="card-title" data-i18n="settings_title"></div>
        <div class="card-hint" data-i18n="settings_hint"></div>
      </div>
    </div>
    <div class="slider-row">
      <label data-i18n="set_size"></label>
      <input type="range" id="logoSize" min="5" max="40" value="15">
      <span class="value" id="logoSizeVal">15%</span>
    </div>
    <div class="slider-row">
      <label data-i18n="set_opacity"></label>
      <input type="range" id="opacity" min="10" max="80" value="35">
      <span class="value" id="opacityVal">35%</span>
    </div>
    <div class="slider-row">
      <label data-i18n="set_rotation"></label>
      <input type="range" id="rotation" min="-60" max="0" value="-30">
      <span class="value" id="rotationVal">-30°</span>
    </div>
    <div class="slider-row">
      <label data-i18n="set_spacing"></label>
      <input type="range" id="spacing" min="100" max="500" value="220">
      <span class="value" id="spacingVal">220</span>
    </div>
    <div class="slider-row" style="flex-wrap: wrap;">
      <label data-i18n="set_payload"></label>
      <input type="text" id="payloadInput" class="text-input" data-i18n-placeholder="set_payload_hint">
      <div class="field-hint" data-i18n="set_payload_help" style="flex-basis: 100%;"></div>
    </div>
  </div>

  <!-- Stap 4: Resultaat -->
  <div class="card locked" id="cardResult">
    <div class="card-head">
      <div class="card-num">4</div>
      <div>
        <div class="card-title" data-i18n="result_title"></div>
        <div class="card-hint" data-i18n="result_hint"></div>
      </div>
    </div>
    <div class="preview-wrap" id="previewWrap">
      <div class="preview-label" data-i18n="result_preview"></div>
      <img id="preview" alt="" style="display:none;">
      <div class="preview-empty" id="previewEmpty" data-i18n="result_empty"></div>
    </div>
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- Actiebalk -->
  <div class="action-bar" id="actionBar">
    <div class="action-bar-inner">
      <button class="btn btn-secondary" id="resetBtn" data-i18n="result_reset"></button>
      <button class="btn btn-primary" id="downloadZipBtn" data-i18n="result_download"></button>
    </div>
  </div>

  <div class="status" id="status"></div>

  <div class="notice">
    <strong data-i18n="notice_strong"></strong>
    <span data-i18n="notice_text"></span>
  </div>

  <footer>
    <span data-i18n="footer_text"></span>
    <a href="https://github.com/keyzerphotos/OpenWatermark">GitHub</a><br>
    <span data-i18n="footer_privacy"></span>
  </footer>

</div>

<script src="invisible-watermark.js"></script>
<script src="app.js"></script>

</body>
</html>
