<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<meta name="mobile-web-app-capable" content="yes">
<title>OpenWatermark</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231473e6'/%3E%3Ctext x='50' y='68' font-family='sans-serif' font-size='54' font-weight='700' text-anchor='middle' fill='%23ffffff'%3EOW%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.2/dist/jszip.min.js"></script>
<style>
  :root {
    --bg: #1e1e1e;
    --bg-2: #252525;
    --panel: #2b2b2b;
    --panel-2: #333333;
    --panel-3: #3a3a3a;
    --border: #3a3a3a;
    --border-hi: #4a4a4a;
    --text: #dcdcdc;
    --text-dim: #a0a0a0;
    --text-muted: #6e6e6e;
    --accent: #1473e6;
    --accent-hi: #2b8bf7;
    --accent-dim: #0d5bb8;
    --accent-glow: rgba(20, 115, 230, 0.15);
    --success: #4ade80;
    --success-glow: rgba(74, 222, 128, 0.2);
    --warning: #fbbf24;
    --danger: #f87171;
    --radius: 6px;
    --radius-sm: 4px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    margin: 0;
    min-height: 100vh;
    font-size: 13px;
  }

  .wrapper {
    max-width: 720px;
    margin: 0 auto;
    padding: calc(20px + var(--safe-top)) 14px calc(48px + var(--safe-bottom));
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 24px;
    position: relative;
    padding-top: 8px;
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .logo-mark {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: #ffffff;
    letter-spacing: -0.02em;
  }
  h1 {
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .subtitle {
    font-size: 0.72rem;
    color: var(--text-dim);
    line-height: 1.5;
    max-width: 440px;
    margin: 0 auto;
  }

  /* Info-knop */
  .info-btn {
    position: absolute;
    top: 0;
    right: 0;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    transition: all 0.15s;
  }
  .info-btn:hover {
    background: var(--panel-2);
    color: var(--text);
  }
  .info-btn:active {
    background: var(--accent);
    color: #ffffff;
  }

  /* Info overlay */
  .info-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 200;
    padding: 20px;
    overflow-y: auto;
  }
  .info-overlay.visible { display: block; }
  .info-panel {
    max-width: 520px;
    margin: 40px auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    line-height: 1.65;
  }
  .info-panel h2 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 14px;
    color: var(--accent-hi);
  }
  .info-panel h3 {
    font-size: 0.85rem;
    font-weight: 600;
    margin-top: 16px;
    margin-bottom: 6px;
    color: var(--text);
  }
  .info-panel p {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .info-panel strong { color: var(--text); font-weight: 600; }
  .info-panel .btn { margin-top: 18px; }

  /* Stappen */
  .steps {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding: 0 8px;
    position: relative;
  }
  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    position: relative;
    z-index: 2;
    flex: 1;
  }
  .step-dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--text-muted);
    transition: all 0.2s;
  }
  .step-label {
    font-size: 0.6rem;
    font-weight: 500;
    color: var(--text-muted);
    transition: color 0.2s;
  }
  .step.active .step-dot {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }
  .step.active .step-label { color: var(--accent-hi); }
  .step.done .step-dot {
    background: var(--success);
    border-color: var(--success);
    color: #1a1a1a;
  }
  .step.done .step-label { color: var(--success); }
  .steps::before {
    content: '';
    position: absolute;
    top: 13px;
    left: 10%;
    right: 10%;
    height: 1px;
    background: var(--border);
    z-index: 1;
  }

  /* Kaarten */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    transition: border-color 0.2s, opacity 0.2s;
  }
  .card.locked {
    opacity: 0.4;
    pointer-events: none;
  }
  .card.done {
    border-color: rgba(74, 222, 128, 0.3);
  }

  .card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .card-num {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    background: var(--panel-3);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 600;
    flex-shrink: 0;
  }
  .card.done .card-num {
    background: var(--success);
    color: #1a1a1a;
  }
  .card-title {
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .card-hint {
    font-size: 0.68rem;
    color: var(--text-muted);
    margin-top: 1px;
    font-weight: 400;
  }

  /* Drop zones */
  .drop-zone {
    border: 1px dashed var(--border-hi);
    border-radius: var(--radius-sm);
    padding: 28px 18px;
    text-align: center;
    cursor: pointer;
    background: var(--bg-2);
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 100px;
  }
  .drop-zone:hover {
    border-color: var(--accent);
    background: rgba(20, 115, 230, 0.06);
  }
  .drop-zone:active {
    background: rgba(20, 115, 230, 0.1);
  }
  .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(20, 115, 230, 0.1);
  }
  .drop-icon { font-size: 1.4rem; opacity: 0.7; }
  .drop-label { font-size: 0.82rem; font-weight: 500; }
  .drop-hint { font-size: 0.68rem; color: var(--text-muted); }

  /* Toggle */
  .toggle-group {
    display: flex;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 2px;
    gap: 2px;
    margin-bottom: 14px;
  }
  .toggle-group button {
    flex: 1;
    padding: 9px 12px;
    background: transparent;
    border: none;
    border-radius: 3px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .toggle-group button.active {
    background: var(--accent);
    color: #ffffff;
    font-weight: 600;
  }

  /* Tekst-modus */
  .text-mode { display: none; }
  .text-mode.visible { display: block; }
  .logo-mode { display: block; }
  .logo-mode.hidden { display: none; }

  .color-picker {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  .color-picker button {
    flex: 1;
    padding: 9px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg-2);
    color: var(--text);
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .color-picker button.active {
    border-color: var(--accent);
    background: rgba(20, 115, 230, 0.1);
    color: var(--accent-hi);
  }
  .color-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1px solid var(--border-hi);
  }

  /* Foto-lijst */
  .photo-list {
    margin-top: 10px;
    max-height: 200px;
    overflow-y: auto;
    display: none;
  }
  .photo-list.visible { display: block; }
  .photo-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    background: var(--bg-2);
    border-radius: 4px;
    margin-bottom: 4px;
    font-size: 0.72rem;
  }
  .photo-item .thumb {
    width: 32px; height: 32px;
    border-radius: 3px; object-fit: cover;
    background: #000; flex-shrink: 0;
  }
  .photo-item .name {
    flex: 1; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
    color: var(--text-dim);
  }
  .photo-item .remove {
    color: var(--text-muted);
    cursor: pointer;
    padding: 5px 7px;
    font-size: 0.9rem;
    border-radius: 3px;
    transition: all 0.15s;
    min-width: 28px; min-height: 28px;
    display: flex; align-items: center; justify-content: center;
  }
  .photo-item .remove:hover {
    background: rgba(248, 113, 113, 0.12);
    color: var(--danger);
  }

  .photo-counter {
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-top: 6px;
    text-align: center;
    padding: 5px 10px;
    background: var(--bg-2);
    border-radius: 4px;
    display: none;
  }
  .photo-counter.visible { display: block; }
  .photo-counter strong { color: var(--accent-hi); font-weight: 600; }

  /* Logo preview */
  .logo-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px;
    background: var(--bg-2);
    border-radius: var(--radius-sm);
  }
  .logo-thumb {
    width: 48px; height: 48px; object-fit: contain;
    background: repeating-conic-gradient(#333 0% 25%, #2b2b2b 0% 50%) 50% / 10px 10px;
    border-radius: 4px; border: 1px solid var(--border);
    padding: 3px; flex-shrink: 0;
  }
  .logo-info { flex: 1; min-width: 0; font-size: 0.75rem; }
  .logo-info .name {
    font-weight: 500; margin-bottom: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .logo-info .meta { color: var(--text-muted); font-size: 0.66rem; }

  /* Sliders */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
  }
  .slider-row:last-child { border-bottom: none; }
  .slider-row label {
    font-size: 0.75rem;
    color: var(--text-dim);
    min-width: 92px;
    font-weight: 400;
    flex-shrink: 0;
  }
  .slider-row input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 3px;
    background: var(--border-hi);
    border-radius: 2px;
    outline: none;
    min-width: 0;
    touch-action: pan-y;
    cursor: pointer;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    background: var(--text);
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.15s;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb:hover {
    background: var(--accent);
  }
  .slider-row input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    background: var(--text);
    border-radius: 50%;
    cursor: pointer;
    border: none;
  }
  .slider-row .value {
    font-size: 0.7rem;
    color: var(--text);
    min-width: 42px;
    text-align: right;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  /* Presets */
  .preset-row {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }
  .preset-btn {
    flex: 1;
    padding: 10px 8px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    line-height: 1.4;
  }
  .preset-btn.active {
    border-color: var(--accent);
    background: rgba(20, 115, 230, 0.1);
    color: var(--accent-hi);
    font-weight: 600;
  }
  .preset-btn small {
    display: block;
    font-size: 0.6rem;
    color: var(--text-muted);
    font-weight: 400;
    margin-top: 2px;
  }
  .preset-btn.active small {
    color: var(--text-dim);
  }

  /* Text input */
  .text-input {
    flex: 1;
    padding: 9px 12px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 0.78rem;
    transition: border-color 0.15s;
    min-width: 0;
  }
  .text-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .field-hint {
    font-size: 0.65rem;
    color: var(--text-muted);
    line-height: 1.5;
    margin-top: 5px;
    padding-left: 2px;
  }

  .field-details {
    flex-basis: 100%;
    margin-top: 8px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .field-details summary {
    padding: 9px 12px;
    cursor: pointer;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--accent-hi);
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    user-select: none;
  }
  .field-details summary::-webkit-details-marker { display: none; }
  .field-details summary::after {
    content: '+';
    font-size: 0.9rem;
    color: var(--text-muted);
  }
  .field-details[open] summary::after {
    content: '-';
  }
  .field-details-body {
    padding: 0 12px 12px;
    font-size: 0.68rem;
    color: var(--text-dim);
    line-height: 1.65;
  }
  .field-details-body p { margin-bottom: 7px; }
  .field-details-body p:last-child { margin-bottom: 0; }
  .field-details-body strong { color: var(--text); font-weight: 600; }
  .field-details-body code {
    background: var(--panel-3);
    padding: 1px 4px;
    border-radius: 3px;
    font-size: 0.64rem;
    color: var(--accent-hi);
  }

  /* Preview */
  .preview-wrap {
    border-radius: var(--radius-sm);
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--bg-2);
  }
  .preview-wrap img { width: 100%; display: block; }
  .preview-label {
    font-size: 0.62rem;
    color: var(--text-muted);
    padding: 6px 10px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 500;
  }
  .preview-empty {
    padding: 28px 14px;
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-muted);
    line-height: 1.5;
    display: block;
  }
  .preview-empty.hidden { display: none; }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px 18px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    width: 100%;
    min-height: 42px;
    letter-spacing: -0.01em;
    position: relative;
  }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary {
    background: var(--accent);
    color: #ffffff;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--accent-hi);
  }
  .btn-primary.success-flash {
    background: var(--success);
    color: #1a1a1a;
  }
  .btn-secondary {
    background: var(--panel-3);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover:not(:disabled) {
    background: var(--border-hi);
  }
  .btn-small {
    padding: 7px 12px;
    font-size: 0.7rem;
    width: auto;
    min-height: 32px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .action-bar {
    display: none;
    margin-top: 16px;
  }
  .action-bar.visible { display: block; }
  .action-bar-inner {
    display: flex;
    gap: 8px;
  }
  .action-bar .btn { flex: 1; }

  .status {
    font-size: 0.72rem;
    color: var(--text-dim);
    text-align: center;
    min-height: 1.2em;
    margin: 12px 0;
    padding: 0 12px;
    transition: color 0.15s;
  }
  .status.success { color: var(--success); font-weight: 500; }
  .status.error { color: var(--danger); font-weight: 500; }
  .status.warning { color: var(--warning); font-weight: 500; }

  .progress-bar {
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 10px;
    display: none;
  }
  .progress-bar.visible { display: block; }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.2s;
  }

  .notice {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 2px solid var(--accent);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 0.68rem;
    color: var(--text-dim);
    line-height: 1.6;
    margin-top: 16px;
  }
  .notice strong { color: var(--accent-hi); font-weight: 600; }

  .alert {
    display: none;
    background: rgba(251, 191, 36, 0.06);
    border: 1px solid rgba(251, 191, 36, 0.25);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 0.68rem;
    color: var(--warning);
    line-height: 1.5;
    margin-bottom: 12px;
  }
  .alert.visible { display: block; }

  .counter-box {
    display: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-top: 16px;
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-dim);
    line-height: 1.4;
  }
  .counter-box.visible { display: block; }
  .counter-box strong {
    color: var(--accent-hi);
    font-size: 1rem;
    font-weight: 600;
    display: block;
    margin-bottom: 1px;
  }

  footer {
    margin-top: 22px;
    font-size: 0.65rem;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.6;
    padding: 0 12px;
  }
  footer a { color: var(--accent-hi); text-decoration: none; }

  @media (max-width: 520px) {
    .wrapper { padding-left: 12px; padding-right: 12px; }
    h1 { font-size: 1.05rem; }
    .subtitle { font-size: 0.68rem; }
    .card { padding: 14px; }

    .slider-row { flex-wrap: wrap; gap: 6px; }
    .slider-row label { min-width: auto; flex: 1; font-size: 0.72rem; }
    .slider-row input[type="range"] { flex-basis: 100%; order: 3; }

    .step-label { font-size: 0.55rem; }
    .step-dot { width: 22px; height: 22px; font-size: 0.62rem; }
    .steps::before { top: 11px; }

    .drop-zone { padding: 20px 14px; min-height: 88px; }
    .drop-label { font-size: 0.78rem; }

    .action-bar-inner { flex-direction: column; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="info-overlay" id="infoOverlay">
  <div class="info-panel">
    <h2 data-i18n="info_title"></h2>
    <div data-i18n-html="info_body"></div>
    <button class="btn btn-primary" id="infoClose" data-i18n="info_close"></button>
  </div>
</div>

<div class="wrapper">

  <header>
    <button class="info-btn" id="infoBtn" aria-label="Info">?</button>
    <div class="logo">
      <div class="logo-mark">OW</div>
      <h1>OpenWatermark</h1>
    </div>
    <p class="subtitle" data-i18n="subtitle"></p>
  </header>

  <div class="steps" id="steps">
    <div class="step" data-step="1">
      <div class="step-dot">1</div>
      <div class="step-label" data-i18n="step_photos"></div>
    </div>
    <div class="step" data-step="2">
      <div class="step-dot">2</div>
      <div class="step-label" data-i18n="step_watermark"></div>
    </div>
    <div class="step" data-step="3">
      <div class="step-dot">3</div>
      <div class="step-label" data-i18n="step_settings"></div>
    </div>
    <div class="step" data-step="4">
      <div class="step-dot">4</div>
      <div class="step-label" data-i18n="step_download"></div>
    </div>
  </div>

  <div class="alert" id="invisibleAlert" data-i18n="invisible_alert"></div>

  <div class="card" id="cardPhotos">
    <div class="card-head">
      <div class="card-num">1</div>
      <div>
        <div class="card-title" data-i18n="photos_title"></div>
        <div class="card-hint" data-i18n="photos_hint_card"></div>
      </div>
    </div>
    <div class="drop-zone" id="photoZone">
      <div class="drop-icon">📷</div>
      <div class="drop-label" data-i18n="photos_drop"></div>
      <div class="drop-hint" data-i18n="photos_hint"></div>
      <input type="file" id="photoInput" accept="image/*" multiple hidden>
    </div>
    <div class="photo-list" id="photoList"></div>
    <div class="photo-counter" id="photoCounter"></div>
  </div>

  <div class="card locked" id="cardWatermark">
    <div class="card-head">
      <div class="card-num">2</div>
      <div>
        <div class="card-title" data-i18n="wm_title"></div>
        <div class="card-hint" data-i18n="wm_hint_card"></div>
      </div>
    </div>

    <div class="toggle-group" id="wmToggle">
      <button type="button" data-mode="text" class="active" data-i18n="wm_toggle_text"></button>
      <button type="button" data-mode="logo" data-i18n="wm_toggle_logo"></button>
    </div>

    <div class="text-mode visible" id="textMode">
      <div class="slider-row" style="border-bottom: none; padding: 0 0 8px 0;">
        <label data-i18n="wm_text_label"></label>
        <input type="text" id="wmText" class="text-input" placeholder="© Jouw Naam 2026" maxlength="60">
      </div>
      <div class="field-hint" data-i18n="wm_text_hint" style="margin-bottom: 10px;"></div>
      <div class="color-picker" id="colorPicker">
        <button type="button" data-color="white" class="active">
          <span class="color-dot" style="background: #ffffff;"></span>
          <span data-i18n="wm_color_white"></span>
        </button>
        <button type="button" data-color="black">
          <span class="color-dot" style="background: #000000;"></span>
          <span data-i18n="wm_color_black"></span>
        </button>
      </div>
    </div>

    <div class="logo-mode hidden" id="logoMode">
      <div class="drop-zone" id="logoZone">
        <div class="drop-icon">✦</div>
        <div class="drop-label" data-i18n="logo_drop"></div>
        <div class="drop-hint" data-i18n="logo_hint"></div>
        <input type="file" id="logoInput" accept="image/png,image/svg+xml,image/webp" hidden>
      </div>
      <div id="logoInfoRow" style="display:none; margin-top:10px;">
        <div class="logo-row">
          <img id="logoThumb" class="logo-thumb" alt="">
          <div class="logo-info">
            <div class="name" id="logoName">logo.png</div>
            <div class="meta" data-i18n="logo_ready"></div>
          </div>
          <button class="btn btn-secondary btn-small" id="changeLogoBtn" data-i18n="logo_change"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="card locked" id="cardSettings">
    <div class="card-head">
      <div class="card-num">3</div>
      <div>
        <div class="card-title" data-i18n="settings_title"></div>
        <div class="card-hint" data-i18n="settings_hint"></div>
      </div>
    </div>

    <div class="preset-row" id="presetRow">
      <button type="button" class="preset-btn active" data-preset="preview">
        <span data-i18n="preset_preview"></span>
        <small data-i18n="preset_preview_desc"></small>
      </button>
      <button type="button" class="preset-btn" data-preset="full">
        <span data-i18n="preset_full"></span>
        <small data-i18n="preset_full_desc"></small>
      </button>
    </div>
    <div class="field-hint" data-i18n="preset_hint" style="margin-bottom: 12px;"></div>

    <div class="slider-row">
      <label data-i18n="set_size"></label>
      <input type="range" id="logoSize" min="5" max="40" value="15" data-default="15">
      <span class="value" id="logoSizeVal">15%</span>
    </div>
    <div class="slider-row">
      <label data-i18n="set_opacity"></label>
      <input type="range" id="opacity" min="10" max="80" value="35" data-default="35">
      <span class="value" id="opacityVal">35%</span>
    </div>
    <div class="slider-row">
      <label data-i18n="set_rotation"></label>
      <input type="range" id="rotation" min="-60" max="0" value="-30" data-default="-30">
      <span class="value" id="rotationVal">-30°</span>
    </div>
    <div class="slider-row">
      <label data-i18n="set_spacing"></label>
      <input type="range" id="spacing" min="100" max="500" value="220" data-default="220">
      <span class="value" id="spacingVal">220</span>
    </div>
    <div class="slider-row" style="flex-wrap: wrap;">
      <label data-i18n="set_payload"></label>
      <input type="text" id="payloadInput" class="text-input" data-i18n-placeholder="set_payload_hint">
      <div class="field-hint" data-i18n="set_payload_help" style="flex-basis: 100%;"></div>
      <details class="field-details">
        <summary data-i18n="set_payload_more"></summary>
        <div class="field-details-body" data-i18n-html="set_payload_explanation"></div>
      </details>
    </div>
  </div>

  <div class="card locked" id="cardResult">
    <div class="card-head">
      <div class="card-num">4</div>
      <div>
        <div class="card-title" data-i18n="result_title"></div>
        <div class="card-hint" data-i18n="result_hint"></div>
      </div>
    </div>
    <div class="preview-wrap" id="previewWrap">
      <div class="preview-label" data-i18n="result_preview"></div>
      <img id="preview" alt="" style="display:none;">
      <div class="preview-empty" id="previewEmpty" data-i18n="result_empty"></div>
    </div>
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="action-bar" id="actionBar">
    <div class="action-bar-inner">
      <button class="btn btn-secondary" id="resetBtn" data-i18n="result_reset"></button>
      <button class="btn btn-primary" id="downloadBtn" data-i18n="result_download_single"></button>
    </div>
  </div>

  <div class="status" id="status"></div>

  <div class="counter-box" id="counterBox">
    <strong id="counterNumber">0</strong>
    <span data-i18n="counter_text"></span>
  </div>

  <div class="notice">
    <strong data-i18n="notice_strong"></strong>
    <span data-i18n="notice_text"></span>
  </div>

  <footer>
    <span data-i18n="footer_text"></span>
    <a href="https://github.com/keyzerphotos/OpenWatermark">GitHub</a><br>
    <span data-i18n="footer_privacy"></span>
  </footer>

</div>

<script src="invisible-watermark.js"></script>
<script src="app.js"></script>

</body>
</html>
